name: 构建小白 macOS 安装包 (PyInstaller + DMG)

#
# 触发方式：
#   1. 手动：到 Actions -> 构建小白 macOS 安装包 -> Run workflow
#   2. 打 Tag：打了形如 v0.6.0 的标签后，自动构建并上传到该标签对应的 GitHub Release
#   3. 每次 push 到 main 分支，也会跑一次构建（仅 artifact，不自动发 Release）
#
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.6.0（留空则用 tag 或默认 0.6.0）"
        required: false
        default: ""

jobs:
  build-macos-dmg:
    name: 构建 macOS .dmg (macos-latest / arm64 + x86_64 通用安装包)
    runs-on: macos-14

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 给 build_macos.sh 加执行权限
        run: chmod +x scripts/build_macos.sh

      - name: 安装 create-dmg（制作 DMG 的小工具）
        run: |
          brew install create-dmg || true
          which create-dmg || echo "create-dmg 未安装，脚本会回退到 hdiutil 原生命令"

      - name: 设置 Python（PyQt5 在 Python 3.11 上最稳定）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: 小白-源代码/requirements.txt

      - name: 安装 Node 18（为未来官网/其它子任务准备）
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: 打印环境信息
        run: |
          echo "macOS: $(sw_vers -productVersion)"
          echo "arch : $(uname -m)"
          echo "python: $(python3 --version)"
          echo "pip   : $(python3 -m pip --version)"

      - name: 运行 build_macos.sh（自动 venv、安装依赖、PyInstaller、签名（ad-hoc）、生成 DMG）
        env:
          XIAOBAI_VERSION: ${{ github.event.inputs.version || ( startsWith(github.ref,'refs/tags/v') && github.ref_name || '0.6.0' ) }}
        run: |
          set -e
          echo "XIAOBAI_VERSION=$XIAOBAI_VERSION"
          bash scripts/build_macos.sh

      - name: 收集产物路径
        id: artifacts
        run: |
          set -e
          SRC="小白-源代码/dist"
          ls -la "$SRC" || true
          DMG="$(ls "$SRC"/*.dmg 2>/dev/null | head -n1 || true)"
          SHA="$(ls "$SRC"/*.sha256 2>/dev/null | head -n1 || true)"
          APP="$(ls -d "$SRC"/*.app 2>/dev/null | head -n1 || true)"
          echo "dmg_path=$DMG" | tee -a "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "$DMG")" | tee -a "$GITHUB_OUTPUT"
          echo "sha_path=$SHA" | tee -a "$GITHUB_OUTPUT"
          echo "sha_name=$(basename "$SHA")" | tee -a "$GITHUB_OUTPUT"
          echo "app_path=$APP" | tee -a "$GITHUB_OUTPUT"
          test -n "$DMG"
          test -n "$SHA"

      - name: 上传构建产物（DMG + SHA256） -> Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Desktop-Pet-White-macOS
          path: |
            ${{ steps.artifacts.outputs.dmg_path }}
            ${{ steps.artifacts.outputs.sha_path }}
          if-no-files-found: error
          retention-days: 60

      # --------------- 打 tag v* 时，自动发布到 GitHub Release ---------------
      - name: 自动发布 Release（仅当打了 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 小白 ${{ github.ref_name }} · macOS 版
          draft: false
          prerelease: false
          files: |
            ${{ steps.artifacts.outputs.dmg_path }}
            ${{ steps.artifacts.outputs.sha_path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
